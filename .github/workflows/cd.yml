name: CD Pipeline - Prod

on:
  push:
    branches:
      - prod

jobs:
  scan:
    name: Job 1 - Scan securite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Scan vulnerabilites avec Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL

  deploy:
    name: Job 2 - Deploiement
    runs-on: ubuntu-latest
    needs: scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Pull et deployer image
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:latest
          docker stop intranet || true
          docker rm intranet || true
          docker run -d --name intranet -p 80:80 ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:latest