name: CI Pipeline - Dev

on:
  push:
    branches:
      - dev

jobs:
  build:
    name: Job 1 - Build image Docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:latest .

  scan:
    name: Job 2 - Scan securite
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Scan vulnerabilites avec Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          exit-code: '1'

  push:
    name: Job 3 - Push vers Docker Hub
    runs-on: ubuntu-latest
    needs: scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build et Push image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:latest

      - name: Notification succes
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "✅ Pipeline CI - Succes"
          body: "Le pipeline CI a ete execute avec succes sur la branche dev."
          to: moussawade@groupeisi.com
          from: ${{ secrets.MAIL_USERNAME }}

      - name: Notification echec
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "❌ Pipeline CI - Echec"
          body: "Le pipeline CI a echoue sur la branche dev."
          to: moussawade@groupeisi.com
          from: ${{ secrets.MAIL_USERNAME }}